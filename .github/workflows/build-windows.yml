name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name DocumentArchivePC --add-data "index.html;." app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DocumentArchivePC-Windows11
          path: dist/DocumentArchivePC.exe
